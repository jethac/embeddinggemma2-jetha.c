name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      arm_cuda_compile:
        description: Compile and stage native ARM64 CUDA121a code; no GPU runtime check
        type: boolean
        default: false
      benchmark_arm_media:
        description: Compare matched precise ARM CPU engines across five modalities at C1/C4
        type: boolean
        default: false
      benchmark_cpu:
        description: Run the matched uncached CPU comparison against pinned llama.cpp
        type: boolean
        default: false
      benchmark_media:
        description: Compare uncached image, audio, video and mixed CPU requests with pinned llama.cpp
        type: boolean
        default: false
      benchmark_metal_media:
        description: Compare the five-modality Metal service with pinned llama.cpp on macOS
        type: boolean
        default: false
      mac_cpu_audio_f16:
        description: Check native Mac CPU F16 audio against original FP32 SDPA
        type: boolean
        default: false
      cpu_pair_vnni:
        description: Enable experimental VNNI paired rows in the multimodal comparison
        type: boolean
        default: false
      media_profile_phases:
        description: Diagnose actual encoder/backbone costs during the media comparison
        type: boolean
        default: false
      vision_clip_metadata:
        description: Check and measure vision metadata clamping on/off on Metal
        type: boolean
        default: false
      metal_media_flash_attn:
        description: Compare forced encoder flash attention against AUTO on Metal
        type: boolean
        default: false
      media_modalities:
        description: Modalities for the matched media comparison
        type: string
        default: 'image,audio,video,mixed'
      media_validate_only:
        description: Check matched media outputs without throughput timing
        type: boolean
        default: false
      packed_qkv:
        description: Enable experimental packed QKV in the CPU comparison
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gemma2-linux:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.benchmark_arm_media) }}
    name: EmbeddingGemma 2 service (Linux CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.benchmark_media && 90 || inputs.benchmark_cpu && 45 || 30 }}
    steps:
      - name: Require VNNI hardware before building the experiment
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark_media && inputs.cpu_pair_vnni
        run: |
          lscpu
          python -c 'from pathlib import Path; assert "avx512_vnni" in Path("/proc/cpuinfo").read_text().split(), "VNNI experiment requires actual AVX-512 VNNI hardware"'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build current model implementation
        run: |
          python tests/dependency_patches2.py
          python tests/model_download2.py
          python tests/benchmark_host2.py
          python tests/installer_identity2.py
          sudo apt-get update -qq
          sudo apt-get install -y nasm
          cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF
          cmake --build build-cmake --target embeddinggemma2-jetha -j 2
          cmake --build build-cmake --target cpu-dispatch-scalar-check2 cpu-dispatch-avx-check2 cpu-dispatch-avx512-check2 media-admission-check2 media-id-check2 jpeg-decode-check2 response-persistence-check2 decoder-stall2 decoder-deadline-check2 -j 2
          build-cmake/bin/cpu-dispatch-scalar-check2
          build-cmake/bin/cpu-dispatch-avx-check2
          build-cmake/bin/cpu-dispatch-avx512-check2
          build-cmake/bin/media-admission-check2
          build-cmake/bin/media-id-check2
          build-cmake/bin/jpeg-decode-check2
          build-cmake/bin/response-persistence-check2
          mkdir -p build-cmake/decoder-stubs
          cp build-cmake/bin/decoder-stall2 build-cmake/decoder-stubs/ffprobe
          cp build-cmake/bin/decoder-stall2 build-cmake/decoder-stubs/ffmpeg
          build-cmake/bin/decoder-deadline-check2 "$PWD/build-cmake/decoder-stubs"
          mkdir -p build-cmake/decoder-only
          cp build-cmake/bin/decoder-stall2 build-cmake/decoder-only/ffmpeg
          build-cmake/bin/decoder-deadline-check2 "$PWD/build-cmake/decoder-only" "$PWD/build-cmake/decoder-stubs/ffprobe"
      - name: Exercise disabled AVX on an emulated older CPU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user ffmpeg
          qemu-x86_64 -cpu qemu64 build-cmake/bin/cpu-dispatch-avx512-check2 --expect-disabled
          qemu-x86_64 -cpu qemu64 build-cmake/bin/jpeg-decode-check2
      - name: Download model and exercise deployed image journey
        env:
          EI_THREADS: '2'
        run: |
          python scripts/download-model2.py
          cmake --install build-cmake --prefix "$PWD/build-installed"
          python tests/installed_service2.py --prefix build-installed
          python scripts/stage-release2.py --build build-cmake --prefix build-installed --dist build-release-assets --target linux-x86_64 --backend cpu
          python tests/installer_runtime2.py --assets build-release-assets
          python tests/media_batch2.py --binary build-installed/bin/embeddinggemma2-jetha --model model/embeddinggemma-2-Q8_0.gguf --mmproj model/mmproj-embeddinggemma-2-Q8_0.gguf
          python tests/qkv_cache2.py --binary build-installed/bin/embeddinggemma2-jetha --model model/embeddinggemma-2-Q8_0.gguf --mmproj model/mmproj-embeddinggemma-2-Q8_0.gguf --mode media-batch
          python tests/qkv_cache2.py --binary build-installed/bin/embeddinggemma2-jetha --model model/embeddinggemma-2-Q8_0.gguf --mmproj model/mmproj-embeddinggemma-2-Q8_0.gguf --mode jpeg-turbo
          python tests/qkv_cache2.py --binary build-installed/bin/embeddinggemma2-jetha --model model/embeddinggemma-2-Q8_0.gguf
          python tests/reuse_inputs2.py --binary build-installed/bin/embeddinggemma2-jetha --model model/embeddinggemma-2-Q8_0.gguf
          python tests/cpu_fallback2.py --binary build-installed/bin/embeddinggemma2-jetha --model model/embeddinggemma-2-Q8_0.gguf
          python tests/cpu_fallback2.py --binary build-installed/bin/embeddinggemma2-jetha --model model/embeddinggemma-2-Q8_0.gguf --emulator /usr/bin/qemu-x86_64
          build-installed/bin/embeddinggemma2-jetha --bind 127.0.0.1 --port 42667 --model model/embeddinggemma-2-Q8_0.gguf --mmproj model/mmproj-embeddinggemma-2-Q8_0.gguf --cache-entries 0 --response-cache-mb 0 > build-cmake/dev.stdout.log 2> build-cmake/dev.stderr.log &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:42667/healthz; then ready=1; break; fi
            if ! kill -0 "$service_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat build-cmake/dev.stderr.log; exit 1; fi
          python tests/dependency_logs2.py --log build-cmake/dev.stderr.log
          python tests/http_body_progress2.py
          python tests/media_text_progress2.py
          python tests/media_budget2.py
          python tests/media_bounds2.py
          python tests/openai_media_model2.py
          python tests/media_json2.py
          python tests/text_context2.py
          python tests/video_container2.py
          python tests/dependency_logs2.py --log build-cmake/dev.stderr.log --video
          python tests/media_singleflight2.py --log build-cmake/dev.stderr.log
          python tests/media_persistence2.py --binary build-cmake/bin/embeddinggemma2-jetha --model model/embeddinggemma-2-Q8_0.gguf --mmproj model/mmproj-embeddinggemma-2-Q8_0.gguf
          python tests/media_decoder_deadline2.py --binary build-cmake/bin/embeddinggemma2-jetha --model model/embeddinggemma-2-Q8_0.gguf --mmproj model/mmproj-embeddinggemma-2-Q8_0.gguf --stub build-cmake/bin/decoder-stall2
          python examples/embed.py --text 'task: search result | query: what powers the cell'
      - name: Build the pinned comparison server with the installed GGML kernels
        if: github.event_name == 'workflow_dispatch' && (inputs.benchmark_cpu || inputs.benchmark_media)
        run: |
          cmake -S build-cmake/_deps/llama-src -B build-llama -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DLLAMA_USE_SYSTEM_GGML=ON -DCMAKE_PREFIX_PATH="$PWD/build-installed" -DLLAMA_BUILD_COMMON=ON -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_APP=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF -DGGML_NATIVE=OFF
          cmake --build build-llama --target llama-server -j 2
          for plugin in "$PWD"/build-installed/bin/libggml-cpu-*.so; do
            ln -s "$plugin" build-llama/bin/
          done
          ldd build-llama/bin/llama-server
          ldd build-installed/bin/embeddinggemma2-jetha
      - name: Measure matched CPU requests in both engine orders
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark_cpu
        env:
          EI_QKV2: ${{ inputs.packed_qkv && '1' || '0' }}
        run: |
          lscpu
          cc --version
          python perf/compare_llamacpp2.py --backend cpu --threads 2 --model model/embeddinggemma-2-Q8_0.gguf --embeddinggemma-bin build-installed/bin/embeddinggemma2-jetha --llama-server build-llama/bin/llama-server --token-counts 32,256,1024 --concurrency 1,4 --rounds 5 --target-seconds 8
      - name: Check CPU audio against the original model before media timing
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark_media
        run: |
          python tests/audio_f16_reference2.py --binary build-installed/bin/embeddinggemma2-jetha --model model/embeddinggemma-2-Q8_0.gguf --mmproj model/mmproj-embeddinggemma-2-Q8_0.gguf --threads 2
      - name: Measure matched multimodal CPU journeys in both engine orders
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark_media
        env:
          EI_CPU_AUDIO_F16_2: '1'
          EI_QKV2: ${{ inputs.packed_qkv && '1' || '0' }}
          MEDIA_MODALITIES: ${{ inputs.media_modalities || 'image,audio,video,mixed' }}
          EI_CPU_Q8_PAIR_VNNI2: ${{ inputs.cpu_pair_vnni && '1' || '0' }}
          MEDIA_VALIDATE_ONLY: ${{ inputs.media_validate_only && '1' || '0' }}
          MEDIA_PROFILE_PHASES: ${{ inputs.media_profile_phases && '1' || '0' }}
        run: |
          lscpu
          cc --version
          args=()
          if [ "$MEDIA_VALIDATE_ONLY" = 1 ]; then args+=(--validate-only); fi
          if [ "$MEDIA_PROFILE_PHASES" = 1 ]; then args+=(--profile-phases); fi
          python perf/compare_media_llamacpp2.py --backend cpu --threads 2 --model model/embeddinggemma-2-Q8_0.gguf --mmproj model/mmproj-embeddinggemma-2-Q8_0.gguf --embeddinggemma-bin build-installed/bin/embeddinggemma2-jetha --llama-server build-llama/bin/llama-server --modalities "$MEDIA_MODALITIES" --concurrency 1,4 --rounds 5 --target-seconds 8 "${args[@]}"
  gemma2-linux-arm64:
    strategy:
      fail-fast: false
      matrix:
        modalities: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.benchmark_arm_media && !inputs.arm_cuda_compile && '["text,audio"]' || '["full"]') }}
    name: ${{ inputs.arm_cuda_compile && 'EmbeddingGemma 2 (Linux ARM64 CUDA compile/link)' || (github.event_name == 'workflow_dispatch' && inputs.benchmark_arm_media && format('Matched ARM CPU vs llama ({0})', matrix.modalities) || 'EmbeddingGemma 2 service (Linux ARM64 CPU)') }}
    runs-on: ubuntu-24.04-arm
    container: ${{ github.event_name == 'workflow_dispatch' && inputs.arm_cuda_compile && 'nvidia/cuda@sha256:d355f456f7b98601efa6af9d12e58c5503d417e6c84d2e5cde4955c90357508b' || 'ubuntu:22.04' }}
    timeout-minutes: ${{ inputs.benchmark_arm_media && 120 || inputs.arm_cuda_compile && 90 || 60 }}
    env:
      EI_ARM_BF16_NEON2: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_arm_media && '1' || '0' }}
      ARM_CUDA_COMPILE: ${{ github.event_name == 'workflow_dispatch' && inputs.arm_cuda_compile && '1' || '0' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the Ubuntu 22.04 ARM64 build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends build-essential git curl ca-certificates python3-pip ffmpeg binutils file qemu-user
          python3 -m pip install --only-binary=:all: cmake==3.30.5
          cmake --version
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the portable ARM64 CPU service
        if: env.ARM_CUDA_COMPILE != '1'
        run: |
          uname -m
          test "$(uname -m)" = aarch64
          lscpu
          gcc --version
          g++ --version
          for compiler in gcc g++; do
            language=c
            if [ "$compiler" = g++ ]; then language=c++; fi
            for arch in armv8-a armv8.2-a+dotprod+fp16; do
              echo "$compiler $arch macros"
              "$compiler" -march="$arch" -dM -E -x "$language" /dev/null | sort | grep -E '__ARM_(ARCH|FEATURE|FP|NEON)'
            done
          done
          cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release -DEI_CPU_DISPATCH=ON -DGGML_CPU_ARM_PORTABLE=ON -DGGML_NATIVE=OFF -DGGML_CUDA=OFF -DGGML_METAL=OFF -DGGML_HIP=OFF -DGGML_SYCL=OFF -DGGML_OPENMP=OFF
          if ! grep -q '^GGML_ARM_PORTABLE_C_SUPPORTED:INTERNAL=1$' build-cmake/CMakeCache.txt || ! grep -q '^GGML_ARM_PORTABLE_CXX_SUPPORTED:INTERNAL=1$' build-cmake/CMakeCache.txt; then
            cat build-cmake/CMakeFiles/CMakeConfigureLog.yaml
            exit 1
          fi
          cmake --build build-cmake --target embeddinggemma2-jetha reference2 -j 2
      - name: Stage and install the ARM64 CPU application
        if: env.ARM_CUDA_COMPILE != '1'
        run: |
          cmake --install build-cmake --prefix "$PWD/build-stage"
          python3 scripts/stage-release2.py --build build-cmake --prefix build-stage --dist build-release-assets --target linux-arm64 --backend cpu
          python3 tests/installer_runtime2.py --assets build-release-assets
          mkdir -p build-packaged/bin
          tar -xzf build-release-assets/embeddinggemma2-jetha-linux-arm64-cpu.runtime.tar.gz -C build-packaged
          cp build-release-assets/embeddinggemma2-jetha-linux-arm64-cpu build-packaged/bin/embeddinggemma2-jetha
          python3 tests/installed_service2.py --prefix build-packaged
          test -f build-packaged/bin/libggml-cpu-armv8.0_1.so
          test -f build-packaged/bin/libggml-cpu-armv8_dotprod_fp16.so
          cp -a build-packaged build-arm-baseline
          mkdir build-arm-held
          mv build-arm-baseline/bin/libggml-cpu-armv8_dotprod_fp16.so build-arm-held/
          python3 tests/installed_service2.py --prefix build-arm-baseline
      - name: Compile and link native ARM64 CUDA121a code
        if: env.ARM_CUDA_COMPILE == '1'
        run: |
          test "$(uname -m)" = aarch64
          lscpu
          /usr/local/cuda/bin/nvcc --version
          # Use GCC11 symbol versions at link time. Do not install or package this library.
          mkdir -p build-gcc11-link
          curl --fail --location --retry 3 -o build-gcc11-link/runtime.deb https://old-releases.ubuntu.com/ubuntu/pool/main/g/gcc-11/libstdc++6_11.2.0-7ubuntu2_arm64.deb
          dpkg-deb -x build-gcc11-link/runtime.deb build-gcc11-link
          link_dir="$PWD/build-gcc11-link/usr/lib/aarch64-linux-gnu"
          ln -s libstdc++.so.6.0.29 "$link_dir/libstdc++.so"
          cmake -S . -B build-cmake "-DCMAKE_EXE_LINKER_FLAGS=-L$link_dir" -DCMAKE_BUILD_TYPE=Release -DEI_CPU_DISPATCH=OFF -DGGML_NATIVE=OFF -DGGML_CUDA=ON -DGGML_CUDA_NCCL=OFF -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc -DCUDAToolkit_ROOT=/usr/local/cuda -DCMAKE_CUDA_ARCHITECTURES=121a-real -DGGML_METAL=OFF -DGGML_HIP=OFF -DGGML_SYCL=OFF -DGGML_OPENMP=OFF
          cmake --build build-cmake --target embeddinggemma2-jetha -j 2
      - name: Stage ARM64 CUDA assets without loading a GPU driver
        if: env.ARM_CUDA_COMPILE == '1'
        run: |
          cmake --install build-cmake --prefix "$PWD/build-stage"
          python3 scripts/stage-release2.py --build build-cmake --prefix build-stage --dist build-release-assets --target linux-arm64 --backend cuda
          mkdir -p build-packaged/bin
          tar -xzf build-release-assets/embeddinggemma2-jetha-linux-arm64-cuda.runtime.tar.gz -C build-packaged
          cp build-release-assets/embeddinggemma2-jetha-linux-arm64-cuda build-packaged/bin/embeddinggemma2-jetha
      - name: Check packaged ARM64 ELF and Ubuntu 22.04 ABI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          for path in Path('build-packaged').rglob('*'):
              if not path.is_file(): continue
              with path.open('rb') as stream:
                  header = stream.read(20)
              if header[:4] != b'\x7fELF': continue
              assert header[4:6] == b'\x02\x01' and int.from_bytes(header[18:20], 'little') == 183, f'{path}: not AArch64 ELF64'
              symbols = subprocess.check_output(['readelf', '--version-info', str(path)], text=True)
              for namespace, limit in [('GLIBC', (2, 34)), ('GLIBCXX', (3, 4, 29))]:
                  versions = [tuple(map(int, v.split('.'))) for v in
                      re.findall(rf'\b{namespace}_(\d+(?:\.\d+)*)\b', symbols)]
                  if not versions: continue
                  maximum = max(versions)
                  print(f'{path}: {namespace}_' + '.'.join(map(str, maximum)))
                  if maximum > limit:
                      imports = subprocess.check_output(['readelf', '--wide', '--dyn-syms', str(path)], text=True)
                      print('\n'.join(line for line in imports.splitlines() if ' UND ' in line and namespace + '_' in line), flush=True)
                  assert maximum <= limit, f'{path}: {namespace} exceeds the Ubuntu 22.04 build baseline'
          PY
      - name: Check packaged CUDA dependencies and 121a code objects
        if: env.ARM_CUDA_COMPILE == '1'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          binary = Path('build-packaged/bin/embeddinggemma2-jetha')
          dynamic = subprocess.check_output(['readelf', '--dynamic', str(binary)], text=True)
          needed = set(re.findall(r'\(NEEDED\).*?\[(.*?)\]', dynamic))
          print('ARM64 CUDA DT_NEEDED:', sorted(needed))
          assert {'libcuda.so.1', 'libcudart.so.13', 'libcublas.so.13', 'libstdc++.so.6'} <= needed, 'missing CUDA runtime dependency'
          imports = subprocess.check_output(['readelf', '--wide', '--dyn-syms', str(binary)], text=True)
          print('\n'.join(line for line in imports.splitlines() if ' UND ' in line and 'condition_variable' in line))
          objects = subprocess.check_output(['/usr/local/cuda/bin/cuobjdump', '--list-elf', str(binary)], text=True)
          print(objects)
          assert set(re.findall(r'sm_[0-9]+[a-z]?', objects)) == {'sm_121a'}, 'unexpected CUDA code architecture'
          print('Native ARM64 CUDA compile/link/staging passed; GPU load and inference remain untested.')
          PY
      - name: Compare installed ARM kernels and exercise baseline ISA safety
        if: env.ARM_CUDA_COMPILE != '1' && !(github.event_name == 'workflow_dispatch' && inputs.benchmark_arm_media)
        env:
          EI_THREADS: '2'
        run: |
          python3 scripts/download-model2.py
          unset LD_LIBRARY_PATH GGML_BACKEND_PATH
          PYTHONPATH="$PWD/perf" python3 - <<'PY'
          import base64, io, json, math, os, signal, struct, subprocess, tempfile, time, urllib.error, urllib.request, wave
          from pathlib import Path
          from types import SimpleNamespace
          from compare_llamacpp import Endpoint, cosine_similarity
          from compare_media_llamacpp2 import fixtures, validate, measure_native_pair

          repo = Path.cwd()
          binaries = {name: (repo / prefix / 'bin/embeddinggemma2-jetha').resolve()
                      for name, prefix in [('on', 'build-packaged'), ('off', 'build-arm-baseline')]}
          model = (repo / 'model/embeddinggemma-2-Q8_0.gguf').resolve()
          mmproj = (repo / 'model/mmproj-embeddinggemma-2-Q8_0.gguf').resolve()
          env = os.environ.copy()
          for key in list(env):
              if key.startswith('EI_') and key != 'EI_THREADS': env.pop(key)
          for key in ('LD_LIBRARY_PATH', 'GGML_BACKEND_PATH'): env.pop(key, None)
          endpoints = {name: Endpoint('127.0.0.1', port, '/v1/embeddings', 'openai')
                       for name, port in [('on', 42667), ('off', 42668)]}
          with tempfile.TemporaryDirectory(prefix='arm-installed-journey-') as tmp:
              root = Path(tmp)
              cases = fixtures(root, 1)
              processes = []
              persistent = set()
              def start(name, label, cache=None, emulate=False, profile=False, precise=True, audio_f16=True):
                  endpoint = endpoints[name]
                  command = [str(binaries[name]), '--bind', endpoint.host, '--port', str(endpoint.port),
                             '--backend', 'cpu', '--model', str(model), '--mmproj', str(mmproj),
                             '--cache-entries', '16' if cache else '0',
                             '--response-cache-mb', '16' if cache else '0']
                  if cache: command += ['--persistent-cache-path', str(cache)]
                  if emulate: command = ['qemu-aarch64', '-cpu', 'cortex-a53'] + command
                  child_env = env.copy()
                  if precise: child_env['EI_ARM_FP16_ACC_F32'] = '1'
                  if audio_f16: child_env['EI_CPU_AUDIO_F16_2'] = '1'
                  if profile: child_env['EI_PROFILE_BACKBONE2'] = '1'
                  log = root / (label + '.log')
                  with log.open('w') as stderr:
                      process = subprocess.Popen(command, cwd=root, env=child_env,
                                                 stdout=subprocess.DEVNULL, stderr=stderr)
                  processes.append(process)
                  if cache: persistent.add(process.pid)
                  deadline = time.monotonic() + (600 if emulate else 180)
                  while time.monotonic() < deadline:
                      if process.poll() is not None: raise AssertionError(log.read_text())
                      try:
                          with urllib.request.urlopen(f'http://{endpoint.host}:{endpoint.port}/healthz', timeout=1):
                              break
                      except OSError: time.sleep(.2)
                  else: raise AssertionError('installed ARM service did not become ready')
                  expected = 'armv8-baseline' if name == 'off' or emulate else ('dotprod-fp16-acc-f32-v2' if precise else 'dotprod-fp16-v1')
                  assert f'ARM CPU numeric variant: {expected}' in log.read_text(), log.read_text()
                  assert ('CPU audio F16 active: 132 Conformer matrices' in log.read_text()) == audio_f16, log.read_text()
                  maps = Path(f'/proc/{process.pid}/maps').read_text()
                  selected = 'armv8.0_1' if expected == 'armv8-baseline' else 'armv8_dotprod_fp16'
                  assert f'libggml-cpu-{selected}.so' in maps, maps
                  if expected == 'armv8-baseline': assert 'libggml-cpu-armv8_dotprod_fp16.so' not in maps
                  assert str(repo / 'build-cmake') not in maps, 'loaded build-tree runtime'
                  return process, log
              def stop(process):
                  process.terminate()
                  try:
                      status = process.wait(timeout=60)
                      # Only persistent-cache servers install graceful stop handlers.
                      expected = (0,) if process.pid in persistent else (0, -signal.SIGTERM)
                      assert status in expected, ('ARM service shutdown failed', status, expected)
                  except subprocess.TimeoutExpired:
                      process.kill(); process.wait(); raise
                  processes.remove(process)
                  persistent.discard(process.pid)
              try:
                  # Same 330 Hz/1 s fixture that failed at cosine .9987010972.
                  # Reproduce with the precision flag absent before testing the fix.
                  on, _ = start('on', 'native-half-acc-q8-control', precise=False, audio_f16=False)
                  off, _ = start('off', 'native-off-q8-control', audio_f16=False)
                  body = cases['audio'][0][0]
                  a, ta = validate(endpoints['on'], body)
                  b, tb = validate(endpoints['off'], body)
                  cosine = cosine_similarity(a, b)
                  assert ta == tb == 29 and .998 < cosine < .999, ('audio regression OFF', ta, tb, cosine)
                  print(json.dumps({'audio_regression_flag_OFF': cosine, 'tokens': ta}), flush=True)
                  stop(on); stop(off)
                  # Q8 5s660 true-HF failure recorded by run38031907573:
                  # baseline .9984561846682671; optimized .9982656009255824.
                  # Qualify the F16 Conformer fix on both modules; no half-path promotion.
                  off, _ = start('off', 'native-baseline-f16')
                  on, _ = start('on', 'native-f32-acc-f16')
                  for kind in ('text', 'image', 'audio', 'video', 'mixed'):
                      body = cases[kind][0][0]
                      a, ta = validate(endpoints['on'], body)
                      b, tb = validate(endpoints['off'], body)
                      cosine = cosine_similarity(a, b)
                      assert ta == tb and cosine > .999, (kind, ta, tb, cosine)
                      print(json.dumps({'quality': kind, 'tokens': ta, 'cosine': cosine}), flush=True)
                  # Pinned original FP32 SDPA references use a boolean audio mask.
                  # Keep the failed fixtures and the >.999 ISA parity gate unchanged.
                  goldens = {}
                  for seconds, frequency in ((1, 330), (1, 660), (5, 660)):
                      golden = json.loads((repo / f'tests/fixtures/audio-{seconds}s{frequency}-hf-f32.json').read_text())
                      assert golden['revision'] == '914f7f89142e33e77833254d9c9b90c3cef7303b'
                      assert (golden['seconds'], golden['frequency_hz'], golden['sample_rate'], golden['amplitude']) == (seconds, frequency, 16000, 4000)
                      assert (golden['reference_dtype'], golden['attention'], golden['audio_mask']) == ('float32', 'sdpa', 'boolean')
                      reference = golden['embedding']
                      assert len(reference) == 768 and all(math.isfinite(x) for x in reference)
                      assert abs(sum(x*x for x in reference) - 1) < .002
                      goldens[(seconds, frequency)] = golden
                  for seconds, frequency, tokens in ((1, 330, 29), (1, 660, 29), (2, 330, 54), (5, 660, 129)):
                      audio = io.BytesIO()
                      with wave.open(audio, 'wb') as wav:
                          wav.setnchannels(1); wav.setsampwidth(2); wav.setframerate(16000)
                          wav.writeframes(b''.join(struct.pack('<h', round(4000 * math.sin(
                              2 * math.pi * frequency * sample / 16000)))
                              for sample in range(seconds * 16000)))
                      url = 'data:audio/wav;base64,' + base64.b64encode(audio.getvalue()).decode()
                      body = dict(cases['audio'][0][0], input={'content': [{'type': 'audio', 'data': url}]})
                      a, ta = validate(endpoints['on'], body)
                      b, tb = validate(endpoints['off'], body)
                      cosine = cosine_similarity(a, b)
                      assert ta == tb == tokens, (seconds, frequency, ta, tb, tokens)
                      if (seconds, frequency) in goldens:
                          golden = goldens[(seconds, frequency)]
                          assert ta == golden['tokens']
                          baseline_hf = cosine_similarity(b, golden['embedding'])
                          optimized_hf = cosine_similarity(a, golden['embedding'])
                          print(json.dumps({'ARM_audio_F16_HF_reference': golden['revision'],
                                            'seconds': seconds, 'frequency_hz': frequency, 'tokens': ta,
                                            'baseline_cosine': baseline_hf, 'optimized_cosine': optimized_hf,
                                            'ISA_cosine': cosine}), flush=True)
                          assert baseline_hf > .999 and optimized_hf > .999, (seconds, frequency, baseline_hf, optimized_hf)
                      assert cosine > .999, (seconds, frequency, ta, tb, cosine)
                      print(json.dumps({'ARM_longer_audio_seconds': seconds, 'frequency_hz': frequency,
                                        'tokens': ta, 'cosine': cosine}), flush=True)
                  options = SimpleNamespace(cooldown=2, quiet_total_cpu_percent=150,
                                            rounds=3, target_seconds=3)
                  for kind in ('text', 'audio', 'image'):
                      bodies = [json.dumps(cases[kind][0][0]).encode()]
                      measured = measure_native_pair(endpoints['on'], endpoints['off'], bodies,
                                                     {on.pid, off.pid}, options)
                      print(json.dumps({'native_ARM_C1': kind, **measured}), flush=True)
                  # Truncation must retain finite normalized results and ISA parity.
                  def request_vector(name, body, dimensions, tokens=None):
                      endpoint = endpoints[name]
                      request = urllib.request.Request(
                          f'http://{endpoint.host}:{endpoint.port}/v1/embeddings',
                          json.dumps(body).encode(), headers={'Content-Type': 'application/json'})
                      with urllib.request.urlopen(request, timeout=1800) as response:
                          result = json.load(response)
                      vector = result['data'][0]['embedding']
                      assert len(vector) == dimensions and all(math.isfinite(v) for v in vector)
                      assert abs(sum(v*v for v in vector) - 1) < .002
                      actual_tokens = result['usage']['prompt_tokens']
                      if tokens is not None: assert actual_tokens == tokens, (actual_tokens, tokens)
                      return vector, actual_tokens
                  for dimensions in (128, 256, 512):
                      for kind in ('text', 'image', 'audio', 'video', 'mixed'):
                          body = dict(cases[kind][0][0], dimensions=dimensions)
                          a, ta = request_vector('on', body, dimensions)
                          b, tb = request_vector('off', body, dimensions)
                          cosine = cosine_similarity(a, b)
                          assert ta == tb and cosine > .999, (kind, dimensions, ta, tb, cosine)
                          if kind == 'audio':
                              reference = goldens[(1, 330)]['embedding'][:dimensions]
                              # cosine_similarity expects unit vectors; a prefix is not unit length.
                              prefix_norm = math.sqrt(sum(x*x for x in reference))
                              assert math.isfinite(prefix_norm) and prefix_norm > 0
                              reference = [x / prefix_norm for x in reference]
                              baseline_hf = cosine_similarity(b, reference)
                              optimized_hf = cosine_similarity(a, reference)
                              print(json.dumps({'ARM_audio_F16_HF_dimensions': dimensions,
                                                'tokens': ta, 'baseline_cosine': baseline_hf,
                                                'optimized_cosine': optimized_hf}), flush=True)
                              assert baseline_hf > .999 and optimized_hf > .999, (dimensions, baseline_hf, optimized_hf)
                          print(json.dumps({'ARM_reduced_dimensions': kind, 'dimensions': dimensions,
                                            'tokens': ta, 'cosine': cosine}), flush=True)
                  # Match the actual tokenizer count; protect the full context boundary.
                  full_context = {'model': 'embeddinggemma-2', 'input': 'q0' + ' x' * (8192 - 4),
                                  'dimensions': 768}
                  a, _ = request_vector('on', full_context, 768, tokens=8192)
                  b, _ = request_vector('off', full_context, 768, tokens=8192)
                  cosine = cosine_similarity(a, b)
                  assert cosine > .999, ('ARM full8192 cosine', cosine)
                  print(json.dumps({'ARM_full_context_tokens': 8192, 'cosine': cosine}), flush=True)
                  oversized = dict(full_context, input=full_context['input'] + ' x')
                  for name in ('on', 'off'):
                      endpoint = endpoints[name]
                      for route in ('/api/embed', '/v1/embeddings'):
                          request = urllib.request.Request(f'http://{endpoint.host}:{endpoint.port}{route}',
                              json.dumps(oversized).encode(), headers={'Content-Type': 'application/json'})
                          try:
                              with urllib.request.urlopen(request, timeout=60) as response: response.read()
                              raise AssertionError(('ARM 8193 accepted', name, route))
                          except urllib.error.HTTPError as error:
                              result = json.load(error)
                              assert error.code == 400 and '1..8192' in json.dumps(result), result
                  print('ARM 8193-token input rejected by both public routes and both ISA paths', flush=True)
                  stop(on); stop(off)

                  # Real unsupported-ISA startup/request: both modules remain present.
                  qemu, _ = start('on', 'cortex-a53', emulate=True)
                  body = json.dumps({'input': 'task: search result | query: cell',
                                     'model': 'embeddinggemma-2', 'dimensions': 768}).encode()
                  req = urllib.request.Request('http://127.0.0.1:42667/v1/embeddings', body,
                                               headers={'Content-Type': 'application/json'})
                  with urllib.request.urlopen(req, timeout=600) as response:
                      result = json.load(response)
                  assert len(result['data'][0]['embedding']) == 768
                  stop(qemu)
                  print('Cortex-A53 real request selected baseline with optimized module present', flush=True)

                  # Persisted arithmetic identities must separate both cache layers.
                  shared = root / 'shared-cache'
                  texts = cases['text'][0][0]
                  images = cases['image'][0][0]
                  native, _ = start('off', 'baseline-q8-cache', cache=shared, audio_f16=False)
                  validate(endpoints['off'], texts); validate(endpoints['off'], images)
                  stop(native)
                  q8_text_id = shared.read_bytes()[16:24]
                  q8_response_id = Path(str(shared) + '.responses').read_bytes()[8:16]
                  native, log = start('off', 'baseline-cache', cache=shared, profile=True)
                  validate(endpoints['off'], texts); validate(endpoints['off'], images)
                  stop(native)
                  baseline_text_id = shared.read_bytes()[16:24]
                  baseline_response_id = Path(str(shared) + '.responses').read_bytes()[8:16]
                  assert log.read_text().count('backbone:') >= 2, 'Q8 snapshots crossed F16 audio identity'
                  assert q8_text_id != baseline_text_id and q8_response_id != baseline_response_id
                  native, log = start('on', 'half-acc-cache', cache=shared, profile=True, precise=False)
                  validate(endpoints['on'], texts); validate(endpoints['on'], images)
                  stop(native)
                  assert log.read_text().count('backbone:') >= 2, 'baseline snapshots crossed half-acc ARM identity'
                  half_text_id = shared.read_bytes()[16:24]
                  half_response_id = Path(str(shared) + '.responses').read_bytes()[8:16]
                  assert baseline_text_id != half_text_id
                  assert baseline_response_id != half_response_id
                  native, log = start('on', 'optimized-cache', cache=shared, profile=True)
                  validate(endpoints['on'], texts); validate(endpoints['on'], images)
                  stop(native)
                  assert log.read_text().count('backbone:') >= 2, 'baseline text/media snapshots crossed ARM numeric identity'
                  assert half_text_id != shared.read_bytes()[16:24]
                  assert half_response_id != Path(str(shared) + '.responses').read_bytes()[8:16]
                  native, log = start('on', 'optimized-cache-restart', cache=shared, profile=True)
                  validate(endpoints['on'], texts); validate(endpoints['on'], images)
                  stop(native)
                  assert 'backbone:' not in log.read_text(), 'same-variant snapshot failed to restore'
                  print('ARM text and media persisted identities isolate ISA variants and restore on restart', flush=True)
              finally:
                  for process in processes:
                      if process.poll() is None:
                          process.terminate()
                          try: process.wait(timeout=30)
                          except subprocess.TimeoutExpired: process.kill(); process.wait()
          PY
      - name: Build the matched ARM comparison server with installed GGML
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark_arm_media && env.ARM_CUDA_COMPILE != '1'
        run: |
          cmake --install build-cmake --prefix "$PWD/build-matched"
          cmake -S build-cmake/_deps/llama-src -B build-llama -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DLLAMA_USE_SYSTEM_GGML=ON -DCMAKE_PREFIX_PATH="$PWD/build-matched" -DLLAMA_BUILD_COMMON=ON -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_APP=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF -DGGML_NATIVE=OFF
          cmake --build build-llama --target llama-server -j 2
          for plugin in "$PWD"/build-matched/bin/libggml-cpu-*.so; do
            ln -s "$plugin" build-llama/bin/
          done
          ldd build-llama/bin/llama-server
          ldd build-matched/bin/embeddinggemma2-jetha
      - name: Qualify matched ARM engines then measure five modalities in both orders
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark_arm_media && env.ARM_CUDA_COMPILE != '1'
        env:
          EI_CPU_AUDIO_F16_2: '1'
          EI_ARM_FP16_ACC_F32: '1'
          ARM_MEDIA_MODALITIES: ${{ matrix.modalities }}
        run: |
          python3 scripts/download-model2.py
          unset LD_LIBRARY_PATH GGML_BACKEND_PATH
          args=(--backend cpu --threads 2 --model model/embeddinggemma-2-Q8_0.gguf --mmproj model/mmproj-embeddinggemma-2-Q8_0.gguf --embeddinggemma-bin build-matched/bin/embeddinggemma2-jetha --llama-server build-llama/bin/llama-server --modalities "$ARM_MEDIA_MODALITIES")
          python3 perf/compare_media_llamacpp2.py "${args[@]}" --validate-only --concurrency 1 --audio-reference tests/fixtures/audio-1s330-hf-f32.json --audio-reference tests/fixtures/audio-1s660-hf-f32.json --audio-reference tests/fixtures/audio-5s660-hf-f32.json
          python3 perf/compare_media_llamacpp2.py "${args[@]}" --concurrency 1,4 --rounds 5 --target-seconds 8 --quiet-total-cpu-percent 10
  gemma2-windows:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.benchmark_arm_media) }}
    name: EmbeddingGemma 2 service (Windows x86_64 CPU)
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up the native MinGW64 toolchain
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          update: true
          install: git mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-python mingw-w64-x86_64-ffmpeg mingw-w64-x86_64-nasm
      - name: Build and stage the current portable CPU service
        run: |
          cmake -S . -B build-cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DEI_CPU_DISPATCH=ON -DGGML_CUDA=OFF -DGGML_METAL=OFF -DGGML_HIP=OFF -DGGML_SYCL=OFF
          cmake --build build-cmake --target embeddinggemma2-jetha cpu-dispatch-scalar-check2 cpu-dispatch-avx-check2 cpu-dispatch-avx512-check2 media-admission-check2 media-id-check2 jpeg-decode-check2 response-persistence-check2 -j 3
          build-cmake/bin/cpu-dispatch-scalar-check2.exe
          build-cmake/bin/cpu-dispatch-avx-check2.exe
          build-cmake/bin/cpu-dispatch-avx512-check2.exe
          build-cmake/bin/media-admission-check2.exe
          build-cmake/bin/media-id-check2.exe
          build-cmake/bin/jpeg-decode-check2.exe
          build-cmake/bin/response-persistence-check2.exe
