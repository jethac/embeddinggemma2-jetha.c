name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      arm_cuda_compile:
        description: Compile and stage native ARM64 CUDA121a code; no GPU runtime check
        type: boolean
        default: false
      benchmark_cpu:
        description: Run the matched uncached CPU comparison against pinned llama.cpp
        type: boolean
        default: false
      benchmark_media:
        description: Compare uncached image, audio, video and mixed CPU requests with pinned llama.cpp
        type: boolean
        default: false
      benchmark_metal_media:
        description: Compare the five-modality Metal service with pinned llama.cpp on macOS
        type: boolean
        default: false
      cpu_pair_vnni:
        description: Enable experimental VNNI paired rows in the multimodal comparison
        type: boolean
        default: false
      media_profile_phases:
        description: Diagnose actual encoder/backbone costs during the media comparison
        type: boolean
        default: false
      vision_clip_metadata:
        description: Check and measure vision metadata clamping on/off on Metal
        type: boolean
        default: false
      metal_media_flash_attn:
        description: Compare forced encoder flash attention against AUTO on Metal
        type: boolean
        default: false
      media_modalities:
        description: Modalities for the matched media comparison
        type: string
        default: 'image,audio,video,mixed'
      media_validate_only:
        description: Check matched media outputs without throughput timing
        type: boolean
        default: false
      packed_qkv:
        description: Enable experimental packed QKV in the CPU comparison
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gemma2-linux:
    name: EmbeddingGemma 2 service (Linux CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.benchmark_media && 90 || inputs.benchmark_cpu && 45 || 30 }}
    steps:
      - name: Require VNNI hardware before building the experiment
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark_media && inputs.cpu_pair_vnni
        run: |
          lscpu
          python -c 'from pathlib import Path; assert "avx512_vnni" in Path("/proc/cpuinfo").read_text().split(), "VNNI experiment requires actual AVX-512 VNNI hardware"'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build current model implementation
        run: |
          python tests/dependency_patches2.py
          python tests/model_download2.py
          python tests/benchmark_host2.py
          python tests/installer_identity2.py
          sudo apt-get update -qq
          sudo apt-get install -y nasm
          cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF
          cmake --build build-cmake --target embeddinggemma2-jetha -j 2
          cmake --build build-cmake --target cpu-dispatch-scalar-check2 cpu-dispatch-avx-check2 cpu-dispatch-avx512-check2 media-admission-check2 media-id-check2 jpeg-decode-check2 response-persistence-check2 decoder-stall2 decoder-deadline-check2 -j 2
          build-cmake/bin/cpu-dispatch-scalar-check2
          build-cmake/bin/cpu-dispatch-avx-check2
          build-cmake/bin/cpu-dispatch-avx512-check2
          build-cmake/bin/media-admission-check2
          build-cmake/bin/media-id-check2
          build-cmake/bin/jpeg-decode-check2
          build-cmake/bin/response-persistence-check2
          mkdir -p build-cmake/decoder-stubs
          cp build-cmake/bin/decoder-stall2 build-cmake/decoder-stubs/ffprobe
          cp build-cmake/bin/decoder-stall2 build-cmake/decoder-stubs/ffmpeg
          build-cmake/bin/decoder-deadline-check2 "$PWD/build-cmake/decoder-stubs"
          mkdir -p build-cmake/decoder-only
          cp build-cmake/bin/decoder-stall2 build-cmake/decoder-only/ffmpeg
          build-cmake/bin/decoder-deadline-check2 "$PWD/build-cmake/decoder-only" "$PWD/build-cmake/decoder-stubs/ffprobe"
      - name: Exercise disabled AVX on an emulated older CPU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user ffmpeg
          qemu-x86_64 -cpu qemu64 build-cmake/bin/cpu-dispatch-avx512-check2 --expect-disabled
          qemu-x86_64 -cpu qemu64 build-cmake/bin/jpeg-decode-check2
      - name: Download model and exercise deployed image journey
        env:
          EI_THREADS: '2'
        run: |
          python scripts/download-model2.py
          cmake --install build-cmake --prefix "$PWD/build-installed"
          python tests/installed_service2.py --prefix build-installed
          python scripts/stage-release2.py --build build-cmake --prefix build-installed --dist build-release-assets --target linux-x86_64 --backend cpu
          python tests/installer_runtime2.py --assets build-release-assets
          python tests/media_batch2.py --binary build-installed/bin/embeddinggemma2-jetha --model model/embeddinggemma-2-Q8_0.gguf --mmproj model/mmproj-embeddinggemma-2-Q8_0.gguf
          python tests/qkv_cache2.py --binary build-installed/bin/embeddinggemma2-jetha --model model/embeddinggemma-2-Q8_0.gguf --mmproj model/mmproj-embeddinggemma-2-Q8_0.gguf --mode media-batch
          python tests/qkv_cache2.py --binary build-installed/bin/embeddinggemma2-jetha --model model/embeddinggemma-2-Q8_0.gguf --mmproj model/mmproj-embeddinggemma-2-Q8_0.gguf --mode jpeg-turbo
          python tests/qkv_cache2.py --binary build-installed/bin/embeddinggemma2-jetha --model model/embeddinggemma-2-Q8_0.gguf
          python tests/reuse_inputs2.py --binary build-installed/bin/embeddinggemma2-jetha --model model/embeddinggemma-2-Q8_0.gguf
          python tests/cpu_fallback2.py --binary build-installed/bin/embeddinggemma2-jetha --model model/embeddinggemma-2-Q8_0.gguf
          python tests/cpu_fallback2.py --binary build-installed/bin/embeddinggemma2-jetha --model model/embeddinggemma-2-Q8_0.gguf --emulator /usr/bin/qemu-x86_64
          build-installed/bin/embeddinggemma2-jetha --bind 127.0.0.1 --port 42667 --model model/embeddinggemma-2-Q8_0.gguf --mmproj model/mmproj-embeddinggemma-2-Q8_0.gguf --cache-entries 0 --response-cache-mb 0 > build-cmake/dev.stdout.log 2> build-cmake/dev.stderr.log &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:42667/healthz; then ready=1; break; fi
            if ! kill -0 "$service_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat build-cmake/dev.stderr.log; exit 1; fi
          python tests/dependency_logs2.py --log build-cmake/dev.stderr.log
          python tests/http_body_progress2.py
          python tests/media_text_progress2.py
          python tests/media_budget2.py
          python tests/media_bounds2.py
          python tests/openai_media_model2.py
          python tests/media_json2.py
          python tests/text_context2.py
          python tests/video_container2.py
          python tests/dependency_logs2.py --log build-cmake/dev.stderr.log --video
          python tests/media_singleflight2.py --log build-cmake/dev.stderr.log
          python tests/media_persistence2.py --binary build-cmake/bin/embeddinggemma2-jetha --model model/embeddinggemma-2-Q8_0.gguf --mmproj model/mmproj-embeddinggemma-2-Q8_0.gguf
          python tests/media_decoder_deadline2.py --binary build-cmake/bin/embeddinggemma2-jetha --model model/embeddinggemma-2-Q8_0.gguf --mmproj model/mmproj-embeddinggemma-2-Q8_0.gguf --stub build-cmake/bin/decoder-stall2
          python examples/embed.py --text 'task: search result | query: what powers the cell'
      - name: Build the pinned comparison server with the installed GGML kernels
        if: github.event_name == 'workflow_dispatch' && (inputs.benchmark_cpu || inputs.benchmark_media)
        run: |
          cmake -S build-cmake/_deps/llama-src -B build-llama -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DLLAMA_USE_SYSTEM_GGML=ON -DCMAKE_PREFIX_PATH="$PWD/build-installed" -DLLAMA_BUILD_COMMON=ON -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_APP=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF -DGGML_NATIVE=OFF
          cmake --build build-llama --target llama-server -j 2
          for plugin in "$PWD"/build-installed/bin/libggml-cpu-*.so; do
            ln -s "$plugin" build-llama/bin/
          done
          ldd build-llama/bin/llama-server
          ldd build-installed/bin/embeddinggemma2-jetha
      - name: Measure matched CPU requests in both engine orders
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark_cpu
        env:
          EI_QKV2: ${{ inputs.packed_qkv && '1' || '0' }}
        run: |
          lscpu
          cc --version
          python perf/compare_llamacpp2.py --backend cpu --threads 2 --model model/embeddinggemma-2-Q8_0.gguf --embeddinggemma-bin build-installed/bin/embeddinggemma2-jetha --llama-server build-llama/bin/llama-server --token-counts 32,256,1024 --concurrency 1,4 --rounds 5 --target-seconds 8
      - name: Measure matched multimodal CPU journeys in both engine orders
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark_media
        env:
          EI_CPU_AUDIO_F16_2: '1'
          EI_QKV2: ${{ inputs.packed_qkv && '1' || '0' }}
          MEDIA_MODALITIES: ${{ inputs.media_modalities || 'image,audio,video,mixed' }}
          EI_CPU_Q8_PAIR_VNNI2: ${{ inputs.cpu_pair_vnni && '1' || '0' }}
          MEDIA_VALIDATE_ONLY: ${{ inputs.media_validate_only && '1' || '0' }}
          MEDIA_PROFILE_PHASES: ${{ inputs.media_profile_phases && '1' || '0' }}
        run: |
          lscpu
          cc --version
          args=()
          if [ "$MEDIA_VALIDATE_ONLY" = 1 ]; then args+=(--validate-only); fi
          if [ "$MEDIA_PROFILE_PHASES" = 1 ]; then args+=(--profile-phases); fi
          python perf/compare_media_llamacpp2.py --backend cpu --threads 2 --model model/embeddinggemma-2-Q8_0.gguf --mmproj model/mmproj-embeddinggemma-2-Q8_0.gguf --embeddinggemma-bin build-installed/bin/embeddinggemma2-jetha --llama-server build-llama/bin/llama-server --modalities "$MEDIA_MODALITIES" --concurrency 1,4 --rounds 5 --target-seconds 8 "${args[@]}"
  gemma2-linux-arm64:
    name: ${{ inputs.arm_cuda_compile && 'EmbeddingGemma 2 (Linux ARM64 CUDA compile/link)' || 'EmbeddingGemma 2 service (Linux ARM64 CPU)' }}
    runs-on: ubuntu-24.04-arm
    container: ${{ github.event_name == 'workflow_dispatch' && inputs.arm_cuda_compile && 'nvidia/cuda@sha256:d355f456f7b98601efa6af9d12e58c5503d417e6c84d2e5cde4955c90357508b' || 'ubuntu:22.04' }}
    timeout-minutes: ${{ inputs.arm_cuda_compile && 90 || 30 }}
    env:
      ARM_CUDA_COMPILE: ${{ github.event_name == 'workflow_dispatch' && inputs.arm_cuda_compile && '1' || '0' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the Ubuntu 22.04 ARM64 build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends build-essential git curl ca-certificates python3-pip ffmpeg binutils file
          python3 -m pip install --only-binary=:all: cmake==3.30.5
          cmake --version
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the portable ARM64 CPU service
        if: env.ARM_CUDA_COMPILE != '1'
        run: |
          uname -m
          test "$(uname -m)" = aarch64
          lscpu
          cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release -DEI_CPU_DISPATCH=OFF -DGGML_NATIVE=OFF -DGGML_CUDA=OFF -DGGML_METAL=OFF -DGGML_HIP=OFF -DGGML_SYCL=OFF -DGGML_OPENMP=OFF
          cmake --build build-cmake --target embeddinggemma2-jetha reference2 -j 2
      - name: Stage and install the ARM64 CPU application
        if: env.ARM_CUDA_COMPILE != '1'
        run: |
          cmake --install build-cmake --prefix "$PWD/build-stage"
          python3 scripts/stage-release2.py --build build-cmake --prefix build-stage --dist build-release-assets --target linux-arm64 --backend cpu
          python3 tests/installer_runtime2.py --assets build-release-assets
          mkdir -p build-packaged/bin
          tar -xzf build-release-assets/embeddinggemma2-jetha-linux-arm64-cpu.runtime.tar.gz -C build-packaged
          cp build-release-assets/embeddinggemma2-jetha-linux-arm64-cpu build-packaged/bin/embeddinggemma2-jetha
          python3 tests/installed_service2.py --prefix build-packaged
      - name: Compile and link native ARM64 CUDA121a code
        if: env.ARM_CUDA_COMPILE == '1'
        run: |
          test "$(uname -m)" = aarch64
          lscpu
          /usr/local/cuda/bin/nvcc --version
          # Use GCC11 symbol versions at link time. Do not install or package this library.
          mkdir -p build-gcc11-link
          curl --fail --location --retry 3 -o build-gcc11-link/runtime.deb https://old-releases.ubuntu.com/ubuntu/pool/main/g/gcc-11/libstdc++6_11.2.0-7ubuntu2_arm64.deb
          dpkg-deb -x build-gcc11-link/runtime.deb build-gcc11-link
          link_dir="$PWD/build-gcc11-link/usr/lib/aarch64-linux-gnu"
          ln -s libstdc++.so.6.0.29 "$link_dir/libstdc++.so"
          cmake -S . -B build-cmake "-DCMAKE_EXE_LINKER_FLAGS=-L$link_dir" -DCMAKE_BUILD_TYPE=Release -DEI_CPU_DISPATCH=OFF -DGGML_NATIVE=OFF -DGGML_CUDA=ON -DGGML_CUDA_NCCL=OFF -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc -DCUDAToolkit_ROOT=/usr/local/cuda -DCMAKE_CUDA_ARCHITECTURES=121a-real -DGGML_METAL=OFF -DGGML_HIP=OFF -DGGML_SYCL=OFF -DGGML_OPENMP=OFF
          cmake --build build-cmake --target embeddinggemma2-jetha -j 2
      - name: Stage ARM64 CUDA assets without loading a GPU driver
        if: env.ARM_CUDA_COMPILE == '1'
        run: |
          cmake --install build-cmake --prefix "$PWD/build-stage"
          python3 scripts/stage-release2.py --build build-cmake --prefix build-stage --dist build-release-assets --target linux-arm64 --backend cuda
          mkdir -p build-packaged/bin
          tar -xzf build-release-assets/embeddinggemma2-jetha-linux-arm64-cuda.runtime.tar.gz -C build-packaged
          cp build-release-assets/embeddinggemma2-jetha-linux-arm64-cuda build-packaged/bin/embeddinggemma2-jetha
      - name: Check packaged ARM64 ELF and Ubuntu 22.04 ABI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          for path in Path('build-packaged').rglob('*'):
              if not path.is_file(): continue
              with path.open('rb') as stream:
                  header = stream.read(20)
              if header[:4] != b'\x7fELF': continue
              assert header[4:6] == b'\x02\x01' and int.from_bytes(header[18:20], 'little') == 183, f'{path}: not AArch64 ELF64'
              symbols = subprocess.check_output(['readelf', '--version-info', str(path)], text=True)
              for namespace, limit in [('GLIBC', (2, 34)), ('GLIBCXX', (3, 4, 29))]:
                  versions = [tuple(map(int, v.split('.'))) for v in
                      re.findall(rf'\b{namespace}_(\d+(?:\.\d+)*)\b', symbols)]
                  if not versions: continue
                  maximum = max(versions)
                  print(f'{path}: {namespace}_' + '.'.join(map(str, maximum)))
                  if maximum > limit:
                      imports = subprocess.check_output(['readelf', '--wide', '--dyn-syms', str(path)], text=True)
                      print('\n'.join(line for line in imports.splitlines() if ' UND ' in line and namespace + '_' in line), flush=True)
                  assert maximum <= limit, f'{path}: {namespace} exceeds the Ubuntu 22.04 build baseline'
          PY
      - name: Check packaged CUDA dependencies and 121a code objects
        if: env.ARM_CUDA_COMPILE == '1'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          binary = Path('build-packaged/bin/embeddinggemma2-jetha')
          dynamic = subprocess.check_output(['readelf', '--dynamic', str(binary)], text=True)
          needed = set(re.findall(r'\(NEEDED\).*?\[(.*?)\]', dynamic))
          print('ARM64 CUDA DT_NEEDED:', sorted(needed))
          assert {'libcuda.so.1', 'libcudart.so.13', 'libcublas.so.13', 'libstdc++.so.6'} <= needed, 'missing CUDA runtime dependency'
          imports = subprocess.check_output(['readelf', '--wide', '--dyn-syms', str(binary)], text=True)
          print('\n'.join(line for line in imports.splitlines() if ' UND ' in line and 'condition_variable' in line))
          objects = subprocess.check_output(['/usr/local/cuda/bin/cuobjdump', '--list-elf', str(binary)], text=True)
          print(objects)
          assert set(re.findall(r'sm_[0-9]+[a-z]?', objects)) == {'sm_121a'}, 'unexpected CUDA code architecture'
          print('Native ARM64 CUDA compile/link/staging passed; GPU load and inference remain untested.')
          PY
      - name: Run all five modalities from the packaged ARM64 application
        if: env.ARM_CUDA_COMPILE != '1'
        env:
          EI_THREADS: '2'
        run: |
          python3 scripts/download-model2.py
          unset LD_LIBRARY_PATH GGML_BACKEND_PATH
          build-packaged/bin/embeddinggemma2-jetha --bind 127.0.0.1 --port 42667 --backend cpu --model model/embeddinggemma-2-Q8_0.gguf --mmproj model/mmproj-embeddinggemma-2-Q8_0.gguf --cache-entries 0 --response-cache-mb 0 > build-cmake/dev.stdout.log 2> build-cmake/dev.stderr.log &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:42667/healthz; then ready=1; break; fi
            if ! kill -0 "$service_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat build-cmake/dev.stderr.log; exit 1; fi
          python3 examples/journey2.py
          python3 - <<'PY'
          import json, math, subprocess, urllib.request
          text = 'task: search result | query: what powers the cell'
          reference = json.loads(subprocess.check_output(['build-cmake/bin/reference2',
              'model/embeddinggemma-2-Q8_0.gguf', text]))
          request = urllib.request.Request('http://127.0.0.1:42667/api/embed',
              json.dumps({'input': text}).encode(), headers={'Content-Type': 'application/json'})
          with urllib.request.urlopen(request, timeout=180) as response:
              actual = json.load(response)['embeddings'][0]
          assert len(reference) == len(actual) == 768
          cosine = sum(x*y for x,y in zip(reference, actual)) / math.sqrt(
              sum(x*x for x in reference) * sum(x*x for x in actual))
          print(f'Linux ARM64 text versus pinned native Q8 reference cosine: {cosine:.8f}')
          assert cosine > 0.999, 'packaged ARM64 text differs from the pinned reference'
          PY
  gemma2-windows:
    name: EmbeddingGemma 2 service (Windows x86_64 CPU)
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up the native MinGW64 toolchain
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          update: true
          install: git mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-python mingw-w64-x86_64-ffmpeg mingw-w64-x86_64-nasm
      - name: Build and stage the current portable CPU service
        run: |
          cmake -S . -B build-cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DEI_CPU_DISPATCH=ON -DGGML_CUDA=OFF -DGGML_METAL=OFF -DGGML_HIP=OFF -DGGML_SYCL=OFF
          cmake --build build-cmake --target embeddinggemma2-jetha cpu-dispatch-scalar-check2 cpu-dispatch-avx-check2 cpu-dispatch-avx512-check2 media-admission-check2 media-id-check2 jpeg-decode-check2 response-persistence-check2 -j 3
          build-cmake/bin/cpu-dispatch-scalar-check2.exe
          build-cmake/bin/cpu-dispatch-avx-check2.exe
          build-cmake/bin/cpu-dispatch-avx512-check2.exe
          build-cmake/bin/media-admission-check2.exe
          build-cmake/bin/media-id-check2.exe
          build-cmake/bin/jpeg-decode-check2.exe
          build-cmake/bin/response-persistence-check2.exe
          cmake --install build-cmake --prefix "$(cygpath -m "$PWD/build-installed")" --strip
          python tests/installed_service2.py --prefix build-installed
          python scripts/stage-release2.py --build build-cmake --prefix build-installed --dist build-release-assets --target windows-x86_64 --backend cpu
      - name: Exercise the Windows runtime installer
        shell: powershell
        run: ./tests/installer_runtime2.ps1 -AssetsDir ./build-release-assets
      - name: Run all five modalities from the packaged application
        env:
          EI_THREADS: '3'
        run: |
          python scripts/download-model2.py
          python - <<'PY'
          from pathlib import Path
          import shutil, zipfile
          prefix = Path('build-packaged')
          with zipfile.ZipFile('build-release-assets/embeddinggemma2-jetha-windows-x86_64-cpu.runtime.zip') as archive:
              archive.extractall(prefix)
          shutil.copy2('build-release-assets/embeddinggemma2-jetha-windows-x86_64-cpu.exe', prefix / 'bin/embeddinggemma2-jetha.exe')
          PY
          python tests/installed_service2.py --prefix build-packaged
          python tests/media_batch2.py --binary build-packaged/bin/embeddinggemma2-jetha.exe --model model/embeddinggemma-2-Q8_0.gguf --mmproj model/mmproj-embeddinggemma-2-Q8_0.gguf
          python tests/qkv_cache2.py --binary build-packaged/bin/embeddinggemma2-jetha.exe --model model/embeddinggemma-2-Q8_0.gguf --mmproj model/mmproj-embeddinggemma-2-Q8_0.gguf --mode media-batch
          python tests/qkv_cache2.py --binary build-packaged/bin/embeddinggemma2-jetha.exe --model model/embeddinggemma-2-Q8_0.gguf --mmproj model/mmproj-embeddinggemma-2-Q8_0.gguf --mode jpeg-turbo
          build-packaged/bin/embeddinggemma2-jetha.exe --bind 127.0.0.1 --port 42667 --backend cpu --model model/embeddinggemma-2-Q8_0.gguf --mmproj model/mmproj-embeddinggemma-2-Q8_0.gguf --cache-entries 0 --response-cache-mb 0 > build-cmake/dev.stdout.log 2> build-cmake/dev.stderr.log &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:42667/healthz; then ready=1; break; fi
            if ! kill -0 "$service_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat build-cmake/dev.stderr.log; exit 1; fi
          python tests/dependency_logs2.py --log build-cmake/dev.stderr.log
          python tests/media_text_progress2.py
          python examples/journey2.py
          python tests/media_bounds2.py
          python tests/openai_media_model2.py
          python tests/media_json2.py
  gemma2-macos:
    name: EmbeddingGemma 2 service (macOS ARM CPU)
    runs-on: macos-15
    timeout-minutes: ${{ inputs.benchmark_metal_media && 90 || 30 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Inspect the actual Metal device
        id: metal
        run: |
          swift -e 'import Metal; if let device = MTLCreateSystemDefaultDevice() { print("Metal device: \(device.name)"); } else { print("No Metal device on this runner"); }'
          swift -e 'import Metal; print("available=" + (MTLCreateSystemDefaultDevice() == nil ? "OFF" : "ON"))' >> "$GITHUB_OUTPUT"
      - name: Build the current model for native macOS CPU
        run: |
          cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_METAL=OFF -DGGML_OPENMP=OFF
          cmake --build build-cmake --target embeddinggemma2-jetha reference2 media-admission-check2 media-id-check2 jpeg-decode-check2 response-persistence-check2 decoder-stall2 decoder-deadline-check2 -j 3
          build-cmake/bin/media-admission-check2
          build-cmake/bin/media-id-check2
          build-cmake/bin/jpeg-decode-check2
          build-cmake/bin/response-persistence-check2
          mkdir -p build-cmake/decoder-stubs
          cp build-cmake/bin/decoder-stall2 build-cmake/decoder-stubs/ffprobe
          cp build-cmake/bin/decoder-stall2 build-cmake/decoder-stubs/ffmpeg
          build-cmake/bin/decoder-deadline-check2 "$PWD/build-cmake/decoder-stubs"
      - name: Run all five modality journeys on the native service
        env:
          EI_THREADS: '3'
        run: |
          command -v ffmpeg || brew install ffmpeg
          python3 scripts/download-model2.py
          cmake --install build-cmake --prefix "$PWD/build-installed-cpu"
          python3 scripts/stage-release2.py --build build-cmake --prefix build-installed-cpu --dist build-release-assets --target darwin-arm64 --backend cpu
          python3 tests/installer_runtime2.py --assets build-release-assets
          mkdir -p build-packaged/bin
          tar -xzf build-release-assets/embeddinggemma2-jetha-darwin-arm64-cpu.runtime.tar.gz -C build-packaged
          cp build-release-assets/embeddinggemma2-jetha-darwin-arm64-cpu build-packaged/bin/embeddinggemma2-jetha
          codesign --verify --verbose=2 build-packaged/bin/embeddinggemma2-jetha
          python3 tests/installed_service2.py --prefix build-packaged
          build-packaged/bin/embeddinggemma2-jetha --bind 127.0.0.1 --port 42667 --backend cpu --model model/embeddinggemma-2-Q8_0.gguf --mmproj model/mmproj-embeddinggemma-2-Q8_0.gguf --cache-entries 0 --response-cache-mb 0 > build-cmake/dev.stdout.log 2> build-cmake/dev.stderr.log &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:42667/healthz; then ready=1; break; fi
            if ! kill -0 "$service_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat build-cmake/dev.stderr.log; exit 1; fi
          python3 tests/dependency_logs2.py --log build-cmake/dev.stderr.log
          python3 examples/journey2.py
          if grep -q 'ggml_metal_library_init' build-cmake/dev.stderr.log; then
            echo 'explicit CPU service initialized Metal shaders' >&2
            exit 1
          fi
          python3 - <<'PY'
          import json, math, subprocess, urllib.request
          text = 'task: search result | query: what powers the cell'
          reference = json.loads(subprocess.check_output(['build-cmake/bin/reference2',
              'model/embeddinggemma-2-Q8_0.gguf', text]))
          request = urllib.request.Request('http://127.0.0.1:42667/api/embed',
              json.dumps({'input': text}).encode(), headers={'Content-Type': 'application/json'})
          with urllib.request.urlopen(request, timeout=180) as response:
              actual = json.load(response)['embeddings'][0]
          assert len(reference) == len(actual) == 768
          cosine = sum(x*y for x,y in zip(reference, actual)) / math.sqrt(
              sum(x*x for x in reference) * sum(x*x for x in actual))
          print(f'macOS text versus pinned native Q8 reference cosine: {cosine:.8f}')
          assert cosine > 0.999, 'native macOS text differs from the pinned reference'
          PY
          python3 tests/media_budget2.py
          python3 tests/media_bounds2.py
          python3 tests/openai_media_model2.py
          python3 tests/media_json2.py
          python3 tests/text_context2.py
          python3 tests/video_container2.py
          python3 tests/media_persistence2.py --binary build-cmake/bin/embeddinggemma2-jetha --model model/embeddinggemma-2-Q8_0.gguf --mmproj model/mmproj-embeddinggemma-2-Q8_0.gguf
      - name: Run Metal and compare all five modalities with CPU
        if: steps.metal.outputs.available == 'ON'
        env:
          EI_THREADS: '3'
        run: |
          cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DGGML_OPENMP=OFF
          cmake --build build-cmake --target embeddinggemma2-jetha reference2 -j 3
          cmake --install build-cmake --prefix "$PWD/build-installed"
          python3 tests/installed_service2.py --prefix build-installed
          cmake --install build-cmake --prefix "$PWD/build-stage-metal"
          python3 scripts/stage-release2.py --build build-cmake --prefix build-stage-metal --dist build-release-metal --target darwin-arm64 --backend metal
          python3 tests/installer_runtime2.py --assets build-release-metal --variant metal
          mkdir -p build-packaged-metal/bin
          tar -xzf build-release-metal/embeddinggemma2-jetha-darwin-arm64-metal.runtime.tar.gz -C build-packaged-metal
          cp build-release-metal/embeddinggemma2-jetha-darwin-arm64-metal build-packaged-metal/bin/embeddinggemma2-jetha
          codesign --verify --verbose=2 build-packaged-metal/bin/embeddinggemma2-jetha
          python3 tests/installed_service2.py --prefix build-packaged-metal
          binary="$PWD/build-packaged-metal/bin/embeddinggemma2-jetha"
          "$binary" --bind 127.0.0.1 --port 42667 --backend cpu --model model/embeddinggemma-2-Q8_0.gguf --mmproj model/mmproj-embeddinggemma-2-Q8_0.gguf --cache-entries 0 --response-cache-mb 0 > build-cmake/cpu.stdout.log 2> build-cmake/cpu.stderr.log &
          cpu_pid=$!
          "$binary" --bind 127.0.0.1 --port 42668 --backend metal --model model/embeddinggemma-2-Q8_0.gguf --mmproj model/mmproj-embeddinggemma-2-Q8_0.gguf --cache-entries 0 --response-cache-mb 0 > build-cmake/metal.stdout.log 2> build-cmake/metal.stderr.log &
          metal_pid=$!
          trap 'status=$?; if [ "$status" -ne 0 ]; then tail -n 120 build-cmake/metal.stderr.log; fi; kill "$cpu_pid" "$metal_pid" 2>/dev/null || true; exit "$status"' EXIT
          startup_started=$SECONDS
          startup_deadline=$((SECONDS + 300))
          for port in 42667 42668; do
            ready=0
            while [ "$SECONDS" -lt "$startup_deadline" ]; do
              if curl -fsS --max-time 2 "http://127.0.0.1:$port/healthz" 2>/dev/null; then ready=1; break; fi
              if ! kill -0 "$cpu_pid" 2>/dev/null || ! kill -0 "$metal_pid" 2>/dev/null; then break; fi
              sleep 1
            done
            if [ "$ready" != 1 ]; then cat build-cmake/metal.stderr.log build-cmake/cpu.stderr.log; exit 1; fi
            echo "Service on port $port ready after $((SECONDS - startup_started)) seconds"
          done
          if grep -q 'ggml_metal_library_init' build-cmake/cpu.stderr.log; then
            echo 'explicit CPU service initialized Metal shaders' >&2
            exit 1
          fi
          grep 'EmbeddingGemma 2: MTL' build-cmake/metal.stderr.log
          grep 'CLIP using MTL' build-cmake/metal.stderr.log
          python3 examples/journey2.py --url http://127.0.0.1:42668 --compare-url http://127.0.0.1:42667
      - name: Build the pinned comparison server with the installed Metal kernels
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark_metal_media
        run: |
          if [ '${{ steps.metal.outputs.available }}' != ON ]; then
            echo 'Metal comparison requires a real Metal device' >&2
            exit 1
          fi
          cmake -S build-cmake/_deps/llama-src -B build-llama -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DLLAMA_USE_SYSTEM_GGML=ON -DCMAKE_PREFIX_PATH="$PWD/build-installed" -DLLAMA_BUILD_COMMON=ON -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_APP=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF -DGGML_NATIVE=OFF
          cmake --build build-llama --target llama-server -j 3
          otool -L build-llama/bin/llama-server
      - name: Measure matched Metal media journeys in both engine orders
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark_metal_media
        env:
          MEDIA_MODALITIES: ${{ inputs.media_modalities || 'image,audio,video,mixed' }}
          MEDIA_VALIDATE_ONLY: ${{ inputs.media_validate_only && '1' || '0' }}
          MEDIA_PROFILE_PHASES: ${{ inputs.media_profile_phases && '1' || '0' }}
          MEDIA_VISION_CLIP_METADATA: ${{ inputs.vision_clip_metadata && '1' || '0' }}
          MEDIA_METAL_FLASH_ATTN: ${{ inputs.metal_media_flash_attn && '1' || '0' }}
        run: |
          system_profiler SPHardwareDataType SPDisplaysDataType
          clang --version
          if [ "$MEDIA_PROFILE_PHASES" = 1 ]; then
            python3 tests/media_benchmark_profile2.py --backend metal --model model/embeddinggemma-2-Q8_0.gguf --mmproj model/mmproj-embeddinggemma-2-Q8_0.gguf --embeddinggemma-bin build-packaged-metal/bin/embeddinggemma2-jetha --llama-server build-llama/bin/llama-server
          fi
          args=()
          if [ "$MEDIA_VISION_CLIP_METADATA" = 1 ] && [ "$MEDIA_METAL_FLASH_ATTN" = 1 ]; then
            echo 'Select one Metal experiment at a time' >&2
            exit 1
          fi
          if [ "$MEDIA_VALIDATE_ONLY" = 1 ]; then args+=(--validate-only); fi
          if [ "$MEDIA_PROFILE_PHASES" = 1 ]; then args+=(--profile-phases); fi
          if [ "$MEDIA_VISION_CLIP_METADATA" = 1 ]; then
            python3 perf/compare_media_llamacpp2.py --backend metal --threads 3 --model model/embeddinggemma-2-Q8_0.gguf --mmproj model/mmproj-embeddinggemma-2-Q8_0.gguf --embeddinggemma-bin build-packaged-metal/bin/embeddinggemma2-jetha --llama-server build-llama/bin/llama-server --vision-clip-metadata --validate-only --modalities text,image,audio,video,mixed --concurrency 1
            args+=(--vision-clip-metadata)
          fi
          if [ "$MEDIA_METAL_FLASH_ATTN" = 1 ]; then
            python3 perf/compare_media_llamacpp2.py --backend metal --threads 3 --model model/embeddinggemma-2-Q8_0.gguf --mmproj model/mmproj-embeddinggemma-2-Q8_0.gguf --embeddinggemma-bin build-packaged-metal/bin/embeddinggemma2-jetha --llama-server build-llama/bin/llama-server --metal-media-flash-attn --validate-only --modalities text,image,audio,video,mixed --concurrency 1
            args+=(--metal-media-flash-attn)
          fi
          python3 perf/compare_media_llamacpp2.py --backend metal --threads 3 --model model/embeddinggemma-2-Q8_0.gguf --mmproj model/mmproj-embeddinggemma-2-Q8_0.gguf --embeddinggemma-bin build-packaged-metal/bin/embeddinggemma2-jetha --llama-server build-llama/bin/llama-server --modalities "$MEDIA_MODALITIES" --concurrency 1,4 --rounds 5 --target-seconds 8 "${args[@]}"
  # Retained foundation checks cover the inherited 300M implementation only.
  portable:
    name: Legacy 300M CPU (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-15
            platform: darwin-arm64
          - os: windows-2022
            platform: windows-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up native Windows compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-python
      - name: Run model-free checks and build
        if: runner.os != 'Windows'
        run: make check && make
      - name: Run native Windows checks and build
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make check && make && make test-windows-download
      - name: Download public upstream test model
        run: |
          mkdir -p model
          curl -fL --retry 3 -o model/embeddinggemma-300M-qat-Q4_0.gguf 'https://huggingface.co/ggml-org/embeddinggemma-300M-qat-q4_0-GGUF/resolve/8dd0ca2a66a8f14470acb0e2a71f801afbc5fb73/embeddinggemma-300M-qat-Q4_0.gguf'
          python -c 'import hashlib,pathlib; p=pathlib.Path("model/embeddinggemma-300M-qat-Q4_0.gguf"); assert hashlib.sha256(p.read_bytes()).hexdigest()=="50d28e22432a148f6f8a86eab3700f92add5d1f54baf7790675a2a4dadbccf26"'
      - name: Run embedding and HTTP conformance checks
        if: runner.os != 'Windows'
        run: make test
      - name: Run native Windows embedding and HTTP checks
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make test
      - name: Verify actual executable format and architecture
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          python scripts/check-binary-platform.py "$PLATFORM" "build/embeddinggemma${suffix}"
      - name: Inspect Windows runtime dependencies
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          objdump -f build/embeddinggemma.exe
          objdump -p build/embeddinggemma.exe | grep 'DLL Name'
          if objdump -p build/embeddinggemma.exe | grep -Ei 'DLL Name:.*(msys-|cygwin|libwinpthread|libgcc|libstdc)'; then
            echo 'unexpected non-system runtime DLL dependency' >&2
            exit 1
          fi
      - name: Inspect Unix executable
        if: runner.os != 'Windows'
        run: uname -m && file build/embeddinggemma && cc --version
      - name: Strip Windows executable
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: strip build/embeddinggemma.exe
      - name: Strip Unix executable
        if: runner.os != 'Windows'
        run: strip build/embeddinggemma
      - name: Preserve Windows runtime notices and toolchain provenance
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p dist/licenses
          packages=(mingw-w64-ucrt-x86_64-crt mingw-w64-ucrt-x86_64-winpthreads mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-libgcc)
          pacman -Q "${packages[@]}" > dist/toolchain.txt
          gcc --version >> dist/toolchain.txt
          while IFS= read -r notice; do
            if [ -f "$notice" ]; then
              relative="${notice#*/share/licenses/}"
              mkdir -p "dist/licenses/$(dirname "$relative")"
              cp "$notice" "dist/licenses/$relative"
            fi
          done < <(pacman -Qql "${packages[@]}" | grep '/share/licenses/')
          test -n "$(find dist/licenses -type f -print -quit)"
      - name: Preserve Unix toolchain provenance
        if: runner.os != 'Windows'
        run: mkdir -p dist && cc --version > dist/toolchain.txt
      - name: Stage executable and checksum
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p dist
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          name="embeddinggemma-${PLATFORM}-cpu${suffix}"
          cp "build/embeddinggemma${suffix}" "dist/$name"
          python -c 'import hashlib,pathlib; p=next(pathlib.Path("dist").glob("embeddinggemma-*")); p.with_name(p.name+".sha256").write_text(hashlib.sha256(p.read_bytes()).hexdigest()+"  "+p.name+"\n")'
          cp LICENSE dist/LICENSE
          git rev-parse HEAD > dist/SOURCE_REVISION
      - name: Upload verified executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: embeddinggemma-${{ matrix.platform }}-cpu
          path: dist/*
          if-no-files-found: error
          retention-days: 30
